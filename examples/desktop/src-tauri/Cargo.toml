[package]
name = "aetherfeed"
version = "0.1.0"
description = "AetherFeed Windows desktop client"
authors = ["AetherFeed contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aetherfeed_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
