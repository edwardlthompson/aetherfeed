[package]
name = "aetherfeed-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AetherFeed Argon2id + authenticated-encryption helpers"

[lib]
name = "aetherfeed_crypto"
path = "src/lib.rs"

[[bin]]
name = "aetherfeed-crypto"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
