[package]
name = "aetherfeed-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AetherFeed Argon2id + authenticated-encryption helpers"

[lib]
name = "aetherfeed_crypto"
path = "src/lib.rs"

[[bin]]
name = "aetherfeed-crypto"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
base64 = "0.22"
chacha20poly1305 = "0.11"
hmac = "0.12"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
