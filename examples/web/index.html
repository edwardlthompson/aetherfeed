<!doctype html>
<html lang="en" data-theme="system" dir="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local-first encrypted news, podcast, and booru client" />
    <meta name="theme-color" content="#F7F6F2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta property="og:image" content="/social-preview.svg" />
    <title>AetherFeed</title>
  </head>
  <body>
    <div id="app">
      <p data-boot-fallback style="padding:1rem;font-family:system-ui">Loading AetherFeed…</p>
    </div>
    <script>
      window.addEventListener("error", function (ev) {
        var el = document.querySelector("[data-boot-fallback]");
        if (el) el.textContent = "Boot error: " + (ev.message || "unknown");
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var el = document.querySelector("[data-boot-fallback]");
        if (el) el.textContent = "Boot rejection: " + String(ev.reason || "unknown");
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
    <script nomodule>
      var el = document.querySelector("[data-boot-fallback]");
      if (el) el.textContent = "This WebView cannot run ES modules.";
    </script>
  </body>
</html>
